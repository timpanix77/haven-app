name: Build HAVEN Production APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Native 1x1 Launcher Icons
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil
          python3 - << 'PYEOF'
          import os, glob
          from PIL import Image

          res_dir = "app/src/main/res"
          os.makedirs(res_dir, exist_ok=True)

          for old in glob.glob(os.path.join(res_dir, "mipmap-*", "ic_launcher*.xml")):
              os.remove(old)

          root_files = sorted(os.listdir("."))
          src_path = next(
              (
                  f for f in root_files
                  if os.path.isfile(f)
                  and f.lower().startswith("haven_icon")
                  and f.lower().endswith((".png", ".jpg", ".jpeg", ".webp"))
              ),
              None,
          )

          if not src_path:
              raise FileNotFoundError("Haven_Icon image not found in repository root.")

          im = Image.open(src_path).convert("RGBA")
          w, h = im.size
          side = min(w, h)
          left = (w - side) // 2
          top = (h - side) // 2
          base = im.crop((left, top, left + side, top + side)).resize((1024, 1024), Image.LANCZOS)

          densities = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          for folder, px in densities.items():
              out_dir = os.path.join(res_dir, folder)
              os.makedirs(out_dir, exist_ok=True)
              icon_sq = base.resize((px, px), Image.LANCZOS).convert("RGB")
              icon_sq.save(os.path.join(out_dir, "ic_launcher.png"), "PNG")
              icon_sq.save(os.path.join(out_dir, "ic_launcher_round.png"), "PNG")

              fg_px = int(round(px * 2.25))
              fg_canvas = base.resize((fg_px, fg_px), Image.LANCZOS)
              fg_canvas.save(os.path.join(out_dir, "ic_launcher_foreground.png"), "PNG")

          values_dir = os.path.join(res_dir, "values")
          os.makedirs(values_dir, exist_ok=True)
          with open(os.path.join(values_dir, "ic_launcher_background.xml"), "w") as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#0B0F17</color>\n</resources>\n')

          anydpi_dir = os.path.join(res_dir, "mipmap-anydpi-v26")
          os.makedirs(anydpi_dir, exist_ok=True)
          adaptive_xml = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          '''
          for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              with open(os.path.join(anydpi_dir, name), "w") as f:
                  f.write(adaptive_xml)
          PYEOF

